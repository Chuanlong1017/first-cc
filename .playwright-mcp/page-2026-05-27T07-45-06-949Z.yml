                - generic [ref=e441]:
                  - heading "Editor’s summary" [level=2] [ref=e442]
                  - paragraph [ref=e443]: Global mean sea level (GMSL) and climate are inextricably intertwined, a point of great relevance in our warming world. Clark et al. present a reconstruction of GMSL changes over the past 4.5 million years that accounts for temperature-driven changes in the oxygen isotopic compositions of the main ice sheets, as well as changes in ice volume and ocean temperature. This approach provides important insights about ice sheet volumes and variability and the forces that drive conditions over time. —Jesse Smith
                - generic [ref=e444]:
                  - heading "Structured Abstract" [level=2] [ref=e445]
                  - generic [ref=e446]:
                    - heading "INTRODUCTION" [level=3] [ref=e447]
                    - paragraph [ref=e448]:
                      - text: The oxygen isotopic composition (
                      - superscript [ref=e449]: "18"
                      - text: O/
                      - superscript [ref=e450]: "16"
                      - text: O) of benthic foraminifera shells (expressed as δ
                      - superscript [ref=e451]: "18"
                      - text: O
                      - subscript [ref=e452]: b
                      - text: ) has long provided a simple but powerful record of the long-term evolution of combined changes in deep ocean temperature (expressed as δ
                      - superscript [ref=e453]: "18"
                      - text: O
                      - subscript [ref=e454]: T
                      - text: ) and global mean sea level, with the latter recorded by changes in the δ
                      - superscript [ref=e455]: "18"
                      - text: O of seawater (expressed as δ
                      - superscript [ref=e456]: "18"
                      - text: O
                      - subscript [ref=e457]: sw
                      - text: ) due to ice sheet growth and decay. More recently, a widely used strategy to isolate δ
                      - superscript [ref=e458]: "18"
                      - text: O
                      - subscript [ref=e459]: sw
                      - text: by regressing the δ
                      - superscript [ref=e460]: "18"
                      - text: O
                      - subscript [ref=e461]: b
                      - text: record against times of known sea level reinforced the longstanding inference from the δ
                      - superscript [ref=e462]: "18"
                      - text: O
                      - subscript [ref=e463]: b
                      - text: record that sea level change during the past 4.5 million years (Myr) experienced two transitions towards lower sea level lowstands. The first transition [3 to 2.5 million years ago (Ma)] represents increasingly larger Northern Hemisphere (NH) ice sheets that fluctuated with a 41-thousand-year (kyr) periodicity. The second middle Pleistocene transition (MPT) (1.2 to 0.62 Ma) is characterized by even larger fluctuations of NH ice sheets, which changed from a 41-kyr periodicity to a dominant 100-kyr periodicity. In both cases, the transitions occurred in the absence of any changes in the orbital forcing by the Sun, suggesting that the cause(s) of these transitions was internal to the climate system.
                  - generic [ref=e464]:
                    - heading "RATIONALE" [level=3] [ref=e465]
                    - paragraph [ref=e466]:
                      - text: Despite general agreement that each of the two transitions represented an increase in the size of NH ice sheet fluctuations, the regression-based method to reconstruct sea level remains uncertain because by default, it reproduces the δ
                      - superscript [ref=e467]: "18"
                      - text: O
                      - subscript [ref=e468]: b
                      - text: variability. Indeed, multiple lines of evidence—including from terrestrial, marine, and geophysical records that constrain ice sheet extent, as well as from δ
                      - superscript [ref=e469]: "18"
                      - text: O
                      - subscript [ref=e470]: sw
                      - text: which is derived by subtracting known δ
                      - superscript [ref=e471]: "18"
                      - text: O
                      - subscript [ref=e472]: T
                      - text: from the δ
                      - superscript [ref=e473]: "18"
                      - text: O
                      - subscript [ref=e474]: b
                      - text: record—suggest that fluctuations of large NH ice sheets have occurred throughout the past 2.5 Myr, with the MPT thus recording a change in periodicity but not in ice sheet size. If correct, this scenario poses new challenges in understanding the 41-kyr periodicity of large ice sheets in a warmer world as well as the change in ice sheet variability during the MPT.
                  - generic [ref=e475]:
                    - heading "RESULTS" [level=3] [ref=e476]
                    - paragraph [ref=e477]:
                      - text: We converted a new δ
                      - superscript [ref=e478]: "18"
                      - text: O
                      - subscript [ref=e479]: sw
                      - text: record to sea level by applying a mass-balance approach that accounts for time-varying temperature and ice volume effects on the δ
                      - superscript [ref=e480]: "18"
                      - text: O of ice sheets. We find that the first transition in the δ
                      - superscript [ref=e481]: "18"
                      - text: O
                      - subscript [ref=e482]: b
                      - text: record represents an increase in NH ice sheet fluctuations to a size that then reoccurred throughout the remaining 2.5 Myr whereas the second transition represents a decrease in mean ocean temperature accompanied by an increase in its variability. Our climate model results show that the height of large pre-MPT ice sheets allowed them to be in surface mass balance under warmer-than-present global temperatures. Growth and decay of these large ice sheets was paced by 41-kyr obliquity forcing, with deglaciation occurring once ice sheets exceeded a certain size and became unstable. We propose that changes in the Southern Ocean carbon cycle during the MPT modulated the response of global temperature and ice sheets to 41-kyr obliquity forcing, resulting in the emergence of the ~100-kyr signal.
                  - generic [ref=e483]:
                    - heading "CONCLUSION" [level=3] [ref=e484]
                    - paragraph [ref=e485]:
                      - text: Our work creates a new paradigm for the development of the Pleistocene ice ages, in particular the idea that large changes in sea level occurred throughout the Pleistocene rather than temperature varying with ice volume as the Earth cooled. In doing so, our findings modify as well as add several fundamental challenges to our understanding of ice sheet–climate interactions. Underlying each of these challenges is the fact that the dominant orbital-scale sea level variability and its changes over the past 3 Myr are not the ones that would be predicted solely by the associated orbital forcing, suggesting internal feedbacks of the climate system that we propose are largely driven by changes in the Southern Ocean carbon cycle and the effects of these changes on CO
                      - subscript [ref=e486]: "2"
                      - text: and global temperature. High-resolution ice core CO
                      - subscript [ref=e487]: "2"
                      - text: records that extend beyond 0.8 Ma are needed to test our hypotheses.
                    - figure "The benthic δ18O record and global mean sea level over the past 4.5 Myr. The δ18O record measured in benthic foraminifera over the past 4.5 Myr shows two transitions of increasing values (vertical gray rectangles) that are widely interpreted to represent increasingly large ice sheet fluctuations, whereas our new reconstruction of global mean sea level shows that this only applies to the first transition, with large fluctuations of ice sheets reoccurring over the past 2.5 Ma. Horizontal dashed lines are the benthic δ18O value (upper panel) and the sea-level lowstand (lower panel) from the Last Glacial Maximum (21 ka)." [ref=e489]:
                      - img "The benthic δ18O record and global mean sea level over the past 4.5 Myr. The δ18O record measured in benthic foraminifera over the past 4.5 Myr shows two transitions of increasing values (vertical gray rectangles) that are widely interpreted to represent increasingly large ice sheet fluctuations, whereas our new reconstruction of global mean sea level shows that this only applies to the first transition, with large fluctuations of ice sheets reoccurring over the past 2.5 Ma. Horizontal dashed lines are the benthic δ18O value (upper panel) and the sea-level lowstand (lower panel) from the Last Glacial Maximum (21 ka)." [ref=e490]
                      - generic [ref=e491]:
                        - generic [ref=e492]:
                          - text: The benthic δ
                          - superscript [ref=e493]: "18"
