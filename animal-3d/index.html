<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>萌宠骨骼探秘 - 3D 交互展示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #FFF8F0;
      overflow: hidden;
      color: #5A4A3A;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    canvas { display: block; }

    /* 标题 */
    .header {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      pointer-events: none;
      animation: fadeInDown 1s ease;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #8B6914;
      text-shadow: 0 2px 8px rgba(255,255,255,0.8);
      letter-spacing: 2px;
    }
    .header p {
      font-size: 14px;
      color: #A08060;
      margin-top: 6px;
    }

    /* 控制面板 */
    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 250, 245, 0.92);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 20px 28px;
      box-shadow: 0 8px 32px rgba(139, 105, 20, 0.12);
      border: 1px solid rgba(255, 220, 180, 0.5);
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
      min-width: 320px;
      max-width: 90vw;
      animation: fadeInUp 1s ease 0.3s both;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .control-label {
      font-size: 14px;
      font-weight: 600;
      color: #7A5C3A;
      white-space: nowrap;
    }

    /* 切换开关 */
    .toggle-switch {
      position: relative;
      width: 48px;
      height: 26px;
      background: #E0D5C8;
      border-radius: 13px;
      cursor: pointer;
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .toggle-switch.active { background: #D4A574; }
    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: transform 0.3s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .toggle-switch.active::after { transform: translateX(22px); }

    /* 颜色选择 */
    .color-options {
      display: flex;
      gap: 8px;
    }
    .color-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .color-btn:hover { transform: scale(1.15); }
    .color-btn.selected {
      border-color: #8B6914;
      box-shadow: 0 0 0 3px rgba(139, 105, 20, 0.2);
    }
    .color-btn.selected::after {
      content: '\2713';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    /* 提示 */
    .hint {
      position: absolute;
      top: 80px;
      right: 24px;
      background: rgba(255, 250, 245, 0.9);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 12px;
      color: #A08060;
      box-shadow: 0 4px 16px rgba(139, 105, 20, 0.08);
      z-index: 10;
      animation: fadeInRight 1s ease 0.5s both;
      max-width: 180px;
      line-height: 1.6;
    }

    /* 加载动画 */
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 20;
    }
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid #F0E0D0;
      border-top-color: #D4A574;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    .loading p { color: #A08060; font-size: 14px; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes fadeInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @media (max-width: 480px) {
      .header h1 { font-size: 20px; }
      .controls { padding: 16px 20px; min-width: auto; width: 92vw; }
      .hint { display: none; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container">
    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <p>正在加载 3D 模型...</p>
    </div>

    <div class="header">
      <h1>萌宠骨骼探秘</h1>
      <p>拖动旋转 · 滚轮缩放 · 探索小动物的内在世界</p>
    </div>

    <div class="hint">
      试试切换骨骼和外皮<br>观察小可爱的结构吧
    </div>

    <div class="controls">
      <div class="control-row">
        <span class="control-label">显示骨骼</span>
        <div class="toggle-switch active" id="toggle-bone" onclick="toggleBone()"></div>
      </div>
      <div class="control-row">
        <span class="control-label">显示外皮</span>
        <div class="toggle-switch active" id="toggle-skin" onclick="toggleSkin()"></div>
      </div>
      <div class="control-row">
        <span class="control-label">外皮颜色</span>
        <div class="color-options" id="skin-colors"></div>
      </div>
      <div class="control-row">
        <span class="control-label">骨骼颜色</span>
        <div class="color-options" id="bone-colors"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ===== 配置 =====
    const skinPresets = [
      { color: 0xC68E5F, name: '棕熊', emissive: 0x332211 },
      { color: 0xF5F0E8, name: '白猫', emissive: 0x222222 },
      { color: 0xFFB7C5, name: '粉兔', emissive: 0x331122 },
      { color: 0x8FA8B8, name: '灰狼', emissive: 0x111822 },
      { color: 0xD4A574, name: '金毛', emissive: 0x2A1A0A },
    ];

    const bonePresets = [
      { color: 0xFFF8F0, name: '象牙' },
      { color: 0xE8DCC8, name: '米白' },
      { color: 0xC0B8A8, name: '浅灰' },
      { color: 0xF0D878, name: '暖黄' },
      { color: 0xD4A0A0, name: '粉骨' },
    ];

    let scene, camera, renderer, controls;
    let animalGroup, boneGroup, skinGroup;
    let currentSkinIndex = 0, currentBoneIndex = 0;
    let showBone = true, showSkin = true;
    let clock = new THREE.Clock();

    // ===== 初始化场景 =====
    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xFFF8F0);
      scene.fog = new THREE.Fog(0xFFF8F0, 8, 25);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(4, 3, 5);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.SoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      container.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 2;
      controls.maxDistance = 12;
      controls.maxPolarAngle = Math.PI / 2 - 0.05;
      controls.target.set(0, 0.6, 0);
      controls.update();

      setupLights();
      setupGround();
      createAnimal();
      setupUI();

      document.getElementById('loading').style.display = 'none';

      window.addEventListener('resize', onResize);
      animate();
    }

    function setupLights() {
      const ambient = new THREE.AmbientLight(0xFFF0E0, 0.6);
      scene.add(ambient);

      const mainLight = new THREE.DirectionalLight(0xFFE8D0, 1.2);
      mainLight.position.set(3, 6, 4);
      mainLight.castShadow = true;
      mainLight.shadow.mapSize.width = 2048;
      mainLight.shadow.mapSize.height = 2048;
      mainLight.shadow.camera.near = 0.5;
      mainLight.shadow.camera.far = 20;
      mainLight.shadow.camera.left = -5;
      mainLight.shadow.camera.right = 5;
      mainLight.shadow.camera.top = 5;
      mainLight.shadow.camera.bottom = -5;
      mainLight.shadow.bias = -0.001;
      scene.add(mainLight);

      const fillLight = new THREE.DirectionalLight(0xE0E8FF, 0.4);
      fillLight.position.set(-3, 3, -2);
      scene.add(fillLight);

      const rimLight = new THREE.PointLight(0xFFD4A0, 0.5, 10);
      rimLight.position.set(0, 2, -3);
      scene.add(rimLight);
    }

    function setupGround() {
      const groundGeo = new THREE.CircleGeometry(8, 64);
      const groundMat = new THREE.MeshStandardMaterial({
        color: 0xF5EDE0,
        roughness: 0.9,
        metalness: 0,
      });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // 装饰小圆点
      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = 1.5 + Math.random() * 4;
        const dot = new THREE.Mesh(
          new THREE.CircleGeometry(0.03 + Math.random() * 0.04, 16),
          new THREE.MeshBasicMaterial({ color: 0xE8D8C8, transparent: true, opacity: 0.5 })
        );
        dot.rotation.x = -Math.PI / 2;
        dot.position.set(Math.cos(angle) * radius, 0.005, Math.sin(angle) * radius);
        scene.add(dot);
      }
    }

    // ===== 创建动物 =====
    function createAnimal() {
      animalGroup = new THREE.Group();
      boneGroup = new THREE.Group();
      skinGroup = new THREE.Group();

      const skinMat = createSkinMaterial(skinPresets[0]);
      const boneMat = createBoneMaterial(bonePresets[0]);

      // --- 身体 ---
      // 骨骼：脊柱
      const spine = createBone(new THREE.CylinderGeometry(0.06, 0.08, 1.0, 8), boneMat);
      spine.position.set(0, 0.65, 0);
      spine.rotation.z = Math.PI / 2;
      boneGroup.add(spine);

      // 外皮：躯干
      const body = createSkin(new THREE.SphereGeometry(0.55, 32, 32), skinMat);
      body.scale.set(1, 0.85, 0.9);
      body.position.set(0, 0.65, 0);
      skinGroup.add(body);

      // --- 头部 ---
      // 骨骼：头骨
      const skull = createBone(new THREE.SphereGeometry(0.22, 16, 16), boneMat);
      skull.position.set(0.75, 1.15, 0);
      boneGroup.add(skull);

      // 颈椎
      const neck = createBone(new THREE.CylinderGeometry(0.05, 0.06, 0.3, 8), boneMat);
      neck.position.set(0.5, 1.0, 0);
      neck.rotation.z = -Math.PI / 4;
      boneGroup.add(neck);

      // 外皮：头
      const head = createSkin(new THREE.SphereGeometry(0.38, 32, 32), skinMat);
      head.position.set(0.78, 1.15, 0);
      skinGroup.add(head);

      // 吻部
      const snout = createSkin(new THREE.SphereGeometry(0.18, 24, 24), skinMat);
      snout.scale.set(1, 0.7, 0.8);
      snout.position.set(1.08, 1.05, 0);
      skinGroup.add(snout);

      // 鼻子
      const nose = createSkin(new THREE.SphereGeometry(0.06, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0x3A2A1A, roughness: 0.6 }));
      nose.position.set(1.22, 1.08, 0);
      skinGroup.add(nose);

      // 眼睛
      const eyeWhite = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.3 });
      const eyePupil = new THREE.MeshStandardMaterial({ color: 0x1A1A1A, roughness: 0.2 });
      const eyeHighlight = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, emissive: 0x444444 });

      [-1, 1].forEach(side => {
        const eyeW = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), eyeWhite);
        eyeW.position.set(1.05, 1.22, side * 0.18);
        skinGroup.add(eyeW);

        const eyeP = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 16), eyePupil);
        eyeP.position.set(1.1, 1.22, side * 0.18);
        skinGroup.add(eyeP);

        const eyeH = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 8), eyeHighlight);
        eyeH.position.set(1.08, 1.25, side * 0.16);
        skinGroup.add(eyeH);
      });

      // 耳朵
      [-1, 1].forEach(side => {
        // 骨骼
        const earBone = createBone(new THREE.CylinderGeometry(0.02, 0.03, 0.25, 8), boneMat);
        earBone.position.set(0.65, 1.5, side * 0.28);
        earBone.rotation.z = side * 0.3;
        earBone.rotation.x = side * 0.2;
        boneGroup.add(earBone);

        // 外皮
        const ear = createSkin(new THREE.SphereGeometry(0.12, 24, 24), skinMat);
        ear.scale.set(0.6, 1, 0.5);
        ear.position.set(0.65, 1.5, side * 0.28);
        ear.rotation.z = side * 0.3;
        skinGroup.add(ear);

        // 耳内
        const earInner = createSkin(new THREE.SphereGeometry(0.07, 16, 16),
          new THREE.MeshStandardMaterial({
            color: 0xFFDDD0,
            roughness: 0.8,
            transparent: true,
            opacity: 0.7
          }));
        earInner.scale.set(0.5, 0.9, 0.4);
        earInner.position.set(0.63, 1.5, side * 0.25);
        earInner.rotation.z = side * 0.3;
        skinGroup.add(earInner);
      });

      // --- 四肢 ---
      const legPositions = [
        { x: 0.35, z: 0.25, name: 'frontL' },
        { x: 0.35, z: -0.25, name: 'frontR' },
        { x: -0.35, z: 0.25, name: 'backL' },
        { x: -0.35, z: -0.25, name: 'backR' },
      ];

      legPositions.forEach(pos => {
        const isFront = pos.x > 0;
        const yBone = 0.35;

        // 骨骼：腿骨（上）
        const upperLegBone = createBone(new THREE.CylinderGeometry(0.04, 0.05, 0.4, 8), boneMat);
        upperLegBone.position.set(pos.x, yBone + 0.15, pos.z);
        boneGroup.add(upperLegBone);

        // 骨骼：腿骨（下）
        const lowerLegBone = createBone(new THREE.CylinderGeometry(0.03, 0.04, 0.35, 8), boneMat);
        lowerLegBone.position.set(pos.x, yBone - 0.15, pos.z);
        boneGroup.add(lowerLegBone);

        // 外皮：腿（上）
        const upperLeg = createSkin(new THREE.SphereGeometry(0.16, 24, 24), skinMat);
        upperLeg.scale.set(0.7, 1.1, 0.7);
        upperLeg.position.set(pos.x, yBone + 0.1, pos.z);
        skinGroup.add(upperLeg);

        // 外皮：腿（下）
        const lowerLeg = createSkin(new THREE.SphereGeometry(0.13, 24, 24), skinMat);
        lowerLeg.scale.set(0.65, 1.2, 0.65);
        lowerLeg.position.set(pos.x, yBone - 0.15, pos.z);
        skinGroup.add(lowerLeg);

        // 爪子
        const paw = createSkin(new THREE.SphereGeometry(0.1, 16, 16), skinMat);
        paw.scale.set(1, 0.5, 1.2);
        paw.position.set(pos.x, 0.05, pos.z);
        skinGroup.add(paw);
      });

      // --- 尾巴 ---
      // 骨骼：尾椎
      for (let i = 0; i < 5; i++) {
        const tailBone = createBone(new THREE.SphereGeometry(0.03 - i * 0.004, 8, 8), boneMat);
        tailBone.position.set(-0.6 - i * 0.12, 0.55 + i * 0.05, 0);
        boneGroup.add(tailBone);
      }

      // 外皮：尾巴
      const tailCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-0.55, 0.55, 0),
        new THREE.Vector3(-0.75, 0.65, 0.05),
        new THREE.Vector3(-0.95, 0.75, 0),
        new THREE.Vector3(-1.1, 0.8, -0.05),
      ]);
      const tailGeo = new THREE.TubeGeometry(tailCurve, 16, 0.1, 12, false);
      const tail = createSkin(tailGeo, skinMat);
      skinGroup.add(tail);

      // 尾巴尖端
      const tailTip = createSkin(new THREE.SphereGeometry(0.1, 16, 16), skinMat);
      tailTip.position.set(-1.1, 0.8, -0.05);
      skinGroup.add(tailTip);

      animalGroup.add(boneGroup);
      animalGroup.add(skinGroup);
      scene.add(animalGroup);

      // 保存材质引用以便后续更新
      animalGroup.userData.skinMat = skinMat;
      animalGroup.userData.boneMat = boneMat;
      animalGroup.userData.bodyParts = [body, head, snout, tail, tailTip];
      animalGroup.userData.legParts = [];
      legPositions.forEach((pos, i) => {
        animalGroup.userData.legParts.push(skinGroup.children.find(c =>
          c.position.x === pos.x && c.position.y > 0.3 && Math.abs(c.position.z - pos.z) < 0.01
        ));
      });
    }

    function createSkin(geometry, material) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function createBone(geometry, material) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.castShadow = true;
      return mesh;
    }

    function createSkinMaterial(preset) {
      return new THREE.MeshStandardMaterial({
        color: preset.color,
        roughness: 0.75,
        metalness: 0.05,
        emissive: preset.emissive,
        emissiveIntensity: 0.1,
      });
    }

    function createBoneMaterial(preset) {
      return new THREE.MeshStandardMaterial({
        color: preset.color,
        roughness: 0.4,
        metalness: 0.1,
        emissive: preset.color,
        emissiveIntensity: 0.15,
      });
    }

    // ===== UI 设置 =====
    function setupUI() {
      const skinContainer = document.getElementById('skin-colors');
      skinPresets.forEach((preset, i) => {
        const btn = document.createElement('div');
        btn.className = 'color-btn' + (i === 0 ? ' selected' : '');
        btn.style.backgroundColor = '#' + preset.color.toString(16).padStart(6, '0');
        btn.title = preset.name;
        btn.onclick = () => selectSkin(i);
        skinContainer.appendChild(btn);
      });

      const boneContainer = document.getElementById('bone-colors');
      bonePresets.forEach((preset, i) => {
        const btn = document.createElement('div');
        btn.className = 'color-btn' + (i === 0 ? ' selected' : '');
        btn.style.backgroundColor = '#' + preset.color.toString(16).padStart(6, '0');
        btn.title = preset.name;
        btn.onclick = () => selectBone(i);
        boneContainer.appendChild(btn);
      });

      window.toggleBone = () => {
        showBone = !showBone;
        boneGroup.visible = showBone;
        document.getElementById('toggle-bone').classList.toggle('active', showBone);
      };

      window.toggleSkin = () => {
        showSkin = !showSkin;
        skinGroup.visible = showSkin;
        document.getElementById('toggle-skin').classList.toggle('active', showSkin);
      };

      window.selectSkin = (index) => {
        currentSkinIndex = index;
        const preset = skinPresets[index];
        const mat = animalGroup.userData.skinMat;
        mat.color.setHex(preset.color);
        mat.emissive.setHex(preset.emissive);

        document.querySelectorAll('#skin-colors .color-btn').forEach((btn, i) => {
          btn.classList.toggle('selected', i === index);
        });
      };

      window.selectBone = (index) => {
        currentBoneIndex = index;
        const preset = bonePresets[index];
        const mat = animalGroup.userData.boneMat;
        mat.color.setHex(preset.color);
        mat.emissive.setHex(preset.color);

        document.querySelectorAll('#bone-colors .color-btn').forEach((btn, i) => {
          btn.classList.toggle('selected', i === index);
        });
      };
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ===== 动画 =====
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      if (animalGroup) {
        // 呼吸动画
        const breathe = 1 + Math.sin(t * 1.5) * 0.015;
        animalGroup.scale.set(breathe, breathe, breathe);

        // 头部轻微摆动
        const headBone = boneGroup.children.find(c => c.geometry.type === 'SphereGeometry' && c.position.x > 0.5);
        if (headBone) {
          headBone.rotation.y = Math.sin(t * 0.8) * 0.05;
        }

        // 尾巴摇摆
        const tailTip = skinGroup.children.find(c => c.position.x < -1);
        if (tailTip) {
          tailTip.position.y = 0.8 + Math.sin(t * 2.5) * 0.03;
          tailTip.position.z = -0.05 + Math.cos(t * 2.5) * 0.03;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
