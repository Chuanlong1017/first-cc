<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>萌宠骨骼探秘 - 3D 交互展示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #FFF8F0;
      overflow: hidden;
      color: #5A4A3A;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    canvas { display: block; }

    .header {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      pointer-events: none;
      animation: fadeInDown 1s ease;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #8B6914;
      text-shadow: 0 2px 8px rgba(255,255,255,0.8);
      letter-spacing: 2px;
    }
    .header p {
      font-size: 14px;
      color: #A08060;
      margin-top: 6px;
    }

    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 250, 245, 0.92);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 20px 28px;
      box-shadow: 0 8px 32px rgba(139, 105, 20, 0.12);
      border: 1px solid rgba(255, 220, 180, 0.5);
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
      min-width: 340px;
      max-width: 92vw;
      max-height: 70vh;
      overflow-y: auto;
      animation: fadeInUp 1s ease 0.3s both;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .control-label {
      font-size: 14px;
      font-weight: 600;
      color: #7A5C3A;
      white-space: nowrap;
    }

    .toggle-switch {
      position: relative;
      width: 48px;
      height: 26px;
      background: #E0D5C8;
      border-radius: 13px;
      cursor: pointer;
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .toggle-switch.active { background: #D4A574; }
    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: transform 0.3s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .toggle-switch.active::after { transform: translateX(22px); }

    .color-options {
      display: flex;
      gap: 8px;
    }
    .color-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .color-btn:hover { transform: scale(1.15); }
    .color-btn.selected {
      border-color: #8B6914;
      box-shadow: 0 0 0 3px rgba(139, 105, 20, 0.2);
    }
    .color-btn.selected::after {
      content: '\2713';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    /* 滑块 */
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }
    .slider {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 6px;
      background: #E0D5C8;
      border-radius: 3px;
      outline: none;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #D4A574;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .slider-value {
      font-size: 12px;
      color: #A08060;
      min-width: 36px;
      text-align: right;
    }

    /* 上传按钮 */
    .upload-row {
      display: flex;
      gap: 10px;
    }
    .upload-btn {
      flex: 1;
      background: #FAF0E6;
      border: 1.5px dashed #D4A574;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      color: #8B6914;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      font-weight: 500;
    }
    .upload-btn:hover {
      background: #F5E6D0;
      border-style: solid;
    }
    .upload-btn.has-file {
      background: #E8F5E9;
      border-color: #81C784;
      color: #4CAF50;
    }

    .hint {
      position: absolute;
      top: 80px;
      right: 24px;
      background: rgba(255, 250, 245, 0.9);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 12px;
      color: #A08060;
      box-shadow: 0 4px 16px rgba(139, 105, 20, 0.08);
      z-index: 10;
      animation: fadeInRight 1s ease 0.5s both;
      max-width: 180px;
      line-height: 1.6;
    }

    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 248, 240, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: opacity 0.3s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid #F0E0D0;
      border-top-color: #D4A574;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    .loading-overlay p { color: #A08060; font-size: 14px; }

    .toast {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-60px);
      background: rgba(90, 74, 58, 0.9);
      color: white;
      padding: 10px 24px;
      border-radius: 24px;
      font-size: 14px;
      z-index: 30;
      transition: transform 0.3s ease;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes fadeInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @media (max-width: 480px) {
      .header h1 { font-size: 20px; }
      .controls { padding: 16px 18px; min-width: auto; width: 96vw; }
      .hint { display: none; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container">
    <div class="loading-overlay" id="loading">
      <div class="spinner"></div>
      <p>正在加载 3D 场景...</p>
    </div>

    <div class="header">
      <h1>萌宠骨骼探秘</h1>
      <p>拖动旋转 · 滚轮缩放 · 悬停透视 · 探索小动物的内在世界</p>
    </div>

    <div class="hint">
      鼠标悬停在外皮上<br>可看到 X-Ray 透视效果
    </div>

    <div class="toast" id="toast"></div>

    <div class="controls">
      <div class="control-row">
        <span class="control-label">显示骨骼</span>
        <div class="toggle-switch active" id="toggle-bone" onclick="toggleBone()"></div>
      </div>
      <div class="control-row">
        <span class="control-label">显示外皮</span>
        <div class="toggle-switch active" id="toggle-skin" onclick="toggleSkin()"></div>
      </div>

      <div class="control-row">
        <span class="control-label">透视半径</span>
        <div class="slider-wrap">
          <input type="range" class="slider" id="xray-radius" min="0.3" max="2.5" step="0.1" value="1.2" oninput="updateXRayRadius(this.value)">
          <span class="slider-value" id="xray-radius-val">1.2</span>
        </div>
      </div>
      <div class="control-row">
        <span class="control-label">透视强度</span>
        <div class="slider-wrap">
          <input type="range" class="slider" id="xray-strength" min="0" max="1" step="0.05" value="0.95" oninput="updateXRayStrength(this.value)">
          <span class="slider-value" id="xray-strength-val">95%</span>
        </div>
      </div>

      <div class="control-row">
        <span class="control-label">外皮颜色</span>
        <div class="color-options" id="skin-colors"></div>
      </div>
      <div class="control-row">
        <span class="control-label">骨骼颜色</span>
        <div class="color-options" id="bone-colors"></div>
      </div>

      <div class="upload-row">
        <div class="upload-btn" id="btn-upload-skin" onclick="document.getElementById('file-skin').click()">
          📁 上传外皮模型
        </div>
        <div class="upload-btn" id="btn-upload-bone" onclick="document.getElementById('file-bone').click()">
          📁 上传骨骼模型
        </div>
      </div>
      <input type="file" id="file-skin" accept=".gltf,.glb,.obj,.fbx" style="display:none" onchange="handleUpload(event,'skin')">
      <input type="file" id="file-bone" accept=".gltf,.glb,.obj,.fbx" style="display:none" onchange="handleUpload(event,'bone')">
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

    // ===== 配置 =====
    const skinPresets = [
      { color: 0xC68E5F, name: '棕熊', emissive: 0x332211 },
      { color: 0xF5F0E8, name: '白猫', emissive: 0x222222 },
      { color: 0xFFB7C5, name: '粉兔', emissive: 0x331122 },
      { color: 0x8FA8B8, name: '灰狼', emissive: 0x111822 },
      { color: 0xD4A574, name: '金毛', emissive: 0x2A1A0A },
    ];
    const bonePresets = [
      { color: 0xFFF8F0, name: '象牙' },
      { color: 0xE8DCC8, name: '米白' },
      { color: 0xC0B8A8, name: '浅灰' },
      { color: 0xF0D878, name: '暖黄' },
      { color: 0xD4A0A0, name: '粉骨' },
    ];

    let scene, camera, renderer, controls;
    let animalGroup, boneGroup, skinGroup;
    let skinMaterials = [], boneMaterials = [];
    let currentSkinIndex = 0, currentBoneIndex = 0;
    let showBone = true, showSkin = true;
    let clock = new THREE.Clock();
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2(-999, -999);
    let xRayRadius = 1.2, xRayStrength = 0.75;
    let hasUploadedSkin = false, hasUploadedBone = false;

    // ===== 初始化 =====
    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xFFF8F0);
      scene.fog = new THREE.Fog(0xFFF8F0, 8, 25);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(4, 3, 5);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.SoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      container.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 2;
      controls.maxDistance = 12;
      controls.maxPolarAngle = Math.PI / 2 - 0.05;
      controls.target.set(0, 0.6, 0);
      controls.update();

      setupLights();
      setupGround();
      createDefaultAnimal();
      setupUI();
      setupMouseTracking();

      document.getElementById('loading').classList.add('hidden');
      window.addEventListener('resize', onResize);
      animate();
    }

    function setupLights() {
      scene.add(new THREE.AmbientLight(0xFFF0E0, 0.6));
      const main = new THREE.DirectionalLight(0xFFE8D0, 1.2);
      main.position.set(3, 6, 4);
      main.castShadow = true;
      main.shadow.mapSize.set(2048, 2048);
      main.shadow.camera.near = 0.5;
      main.shadow.camera.far = 20;
      main.shadow.camera.left = -5;
      main.shadow.camera.right = 5;
      main.shadow.camera.top = 5;
      main.shadow.camera.bottom = -5;
      main.shadow.bias = -0.001;
      scene.add(main);

      const fill = new THREE.DirectionalLight(0xE0E8FF, 0.4);
      fill.position.set(-3, 3, -2);
      scene.add(fill);

      const rim = new THREE.PointLight(0xFFD4A0, 0.5, 10);
      rim.position.set(0, 2, -3);
      scene.add(rim);
    }

    function setupGround() {
      const g = new THREE.Mesh(
        new THREE.CircleGeometry(8, 64),
        new THREE.MeshStandardMaterial({ color: 0xF5EDE0, roughness: 0.9 })
      );
      g.rotation.x = -Math.PI / 2;
      g.receiveShadow = true;
      scene.add(g);

      for (let i = 0; i < 20; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 1.5 + Math.random() * 4;
        const d = new THREE.Mesh(
          new THREE.CircleGeometry(0.03 + Math.random() * 0.04, 16),
          new THREE.MeshBasicMaterial({ color: 0xE8D8C8, transparent: true, opacity: 0.5 })
        );
        d.rotation.x = -Math.PI / 2;
        d.position.set(Math.cos(a) * r, 0.005, Math.sin(a) * r);
        scene.add(d);
      }
    }

    // ===== X-Ray Shader =====
    function setupXRayMaterial(mat) {
      skinMaterials.push(mat);
      mat.onBeforeCompile = (shader) => {
        shader.uniforms.uHoverPoint = { value: new THREE.Vector3(9999, 9999, 9999) };
        shader.uniforms.uHoverRadius = { value: xRayRadius };
        shader.uniforms.uHoverStrength = { value: xRayStrength };

        shader.vertexShader = shader.vertexShader.replace(
          '#include <common>',
          `#include <common>\nvarying vec3 vWorldPosition;`
        );
        shader.vertexShader = shader.vertexShader.replace(
          '#include <worldpos_vertex>',
          `#include <worldpos_vertex>\nvWorldPosition = (modelMatrix * vec4(position, 1.0)).xyz;`
        );
        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <common>',
          `#include <common>\nuniform vec3 uHoverPoint;\nuniform float uHoverRadius;\nuniform float uHoverStrength;\nvarying vec3 vWorldPosition;`
        );
        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <opaque_fragment>',
          `#include <opaque_fragment>\nfloat dist = distance(vWorldPosition, uHoverPoint);\nfloat hoverFactor = 1.0 - smoothstep(0.0, uHoverRadius, dist);\nfloat alpha = mix(1.0, max(1.0 - uHoverStrength, 0.05), hoverFactor);\ngl_FragColor.a *= alpha;`
        );
        mat.userData.shader = shader;
      };
    }

    function updateXRayUniforms() {
      skinMaterials.forEach(mat => {
        if (mat.userData.shader) {
          mat.userData.shader.uniforms.uHoverRadius.value = xRayRadius;
          mat.userData.shader.uniforms.uHoverStrength.value = xRayStrength;
        }
      });
    }

    function setHoverPoint(point) {
      skinMaterials.forEach(mat => {
        if (mat.userData.shader) {
          mat.userData.shader.uniforms.uHoverPoint.value.copy(point);
        }
      });
    }

    function clearHoverPoint() {
      skinMaterials.forEach(mat => {
        if (mat.userData.shader) {
          mat.userData.shader.uniforms.uHoverPoint.value.set(9999, 9999, 9999);
        }
      });
    }

    // ===== 默认动物 =====
    function createDefaultAnimal() {
      animalGroup = new THREE.Group();
      boneGroup = new THREE.Group();
      skinGroup = new THREE.Group();
      skinMaterials = [];
      boneMaterials = [];

      const skinMat = createSkinMaterial(skinPresets[0]);
      const boneMat = createBoneMaterial(bonePresets[0]);

      // 脊柱
      addBone(new THREE.CylinderGeometry(0.06, 0.08, 1.0, 8), boneMat, [0, 0.65, 0], [0, 0, Math.PI / 2]);
      // 躯干
      addSkin(new THREE.SphereGeometry(0.55, 32, 32), skinMat, [0, 0.65, 0], [1, 0.85, 0.9]);
      // 头骨
      addBone(new THREE.SphereGeometry(0.22, 16, 16), boneMat, [0.75, 1.15, 0]);
      // 颈椎
      addBone(new THREE.CylinderGeometry(0.05, 0.06, 0.3, 8), boneMat, [0.5, 1.0, 0], [0, 0, -Math.PI / 4]);
      // 头部
      addSkin(new THREE.SphereGeometry(0.38, 32, 32), skinMat, [0.78, 1.15, 0]);
      // 吻部
      addSkin(new THREE.SphereGeometry(0.18, 24, 24), skinMat, [1.08, 1.05, 0], [1, 0.7, 0.8]);
      // 鼻子
      addSkin(new THREE.SphereGeometry(0.06, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0x3A2A1A, roughness: 0.6 }), [1.22, 1.08, 0]);

      // 眼睛
      const eyeW = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.3 });
      const eyeP = new THREE.MeshStandardMaterial({ color: 0x1A1A1A, roughness: 0.2 });
      const eyeH = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, emissive: 0x444444 });
      [-1, 1].forEach(s => {
        addToGroup(skinGroup, new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), eyeW), [1.05, 1.22, s * 0.18]);
        addToGroup(skinGroup, new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 16), eyeP), [1.1, 1.22, s * 0.18]);
        addToGroup(skinGroup, new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 8), eyeH), [1.08, 1.25, s * 0.16]);
      });

      // 耳朵
      [-1, 1].forEach(s => {
        addBone(new THREE.CylinderGeometry(0.02, 0.03, 0.25, 8), boneMat, [0.65, 1.5, s * 0.28], [s * 0.2, 0, s * 0.3]);
        addSkin(new THREE.SphereGeometry(0.12, 24, 24), skinMat, [0.65, 1.5, s * 0.28], [0.6, 1, 0.5], [s * 0.3, 0, 0]);
        addSkin(new THREE.SphereGeometry(0.07, 16, 16),
          new THREE.MeshStandardMaterial({ color: 0xFFDDD0, roughness: 0.8, transparent: true, opacity: 0.7 }),
          [0.63, 1.5, s * 0.25], [0.5, 0.9, 0.4], [s * 0.3, 0, 0]);
      });

      // 四肢
      [[0.35, 0.25], [0.35, -0.25], [-0.35, 0.25], [-0.35, -0.25]].forEach(([x, z]) => {
        addBone(new THREE.CylinderGeometry(0.04, 0.05, 0.4, 8), boneMat, [x, 0.5, z]);
        addBone(new THREE.CylinderGeometry(0.03, 0.04, 0.35, 8), boneMat, [x, 0.15, z]);
        addSkin(new THREE.SphereGeometry(0.16, 24, 24), skinMat, [x, 0.75, z], [0.7, 1.1, 0.7]);
        addSkin(new THREE.SphereGeometry(0.13, 24, 24), skinMat, [x, 0.4, z], [0.65, 1.2, 0.65]);
        addSkin(new THREE.SphereGeometry(0.1, 16, 16), skinMat, [x, 0.05, z], [1, 0.5, 1.2]);
      });

      // 尾巴骨骼
      for (let i = 0; i < 5; i++) {
        addBone(new THREE.SphereGeometry(0.03 - i * 0.004, 8, 8), boneMat, [-0.6 - i * 0.12, 0.55 + i * 0.05, 0]);
      }
      // 尾巴外皮
      const tailCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-0.55, 0.55, 0),
        new THREE.Vector3(-0.75, 0.65, 0.05),
        new THREE.Vector3(-0.95, 0.75, 0),
        new THREE.Vector3(-1.1, 0.8, -0.05),
      ]);
      addSkin(new THREE.TubeGeometry(tailCurve, 16, 0.1, 12, false), skinMat);
      addSkin(new THREE.SphereGeometry(0.1, 16, 16), skinMat, [-1.1, 0.8, -0.05]);

      animalGroup.add(boneGroup);
      animalGroup.add(skinGroup);
      scene.add(animalGroup);
    }

    function addSkin(geo, mat, pos, scale, rot) {
      const mesh = new THREE.Mesh(geo, mat);
      if (pos) mesh.position.set(...pos);
      if (scale) mesh.scale.set(...scale);
      if (rot) mesh.rotation.set(...rot);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      skinGroup.add(mesh);
    }

    function addBone(geo, mat, pos, rot) {
      const mesh = new THREE.Mesh(geo, mat);
      if (pos) mesh.position.set(...pos);
      if (rot) mesh.rotation.set(...rot);
      mesh.castShadow = true;
      boneGroup.add(mesh);
    }

    function addToGroup(group, mesh, pos) {
      if (pos) mesh.position.set(...pos);
      group.add(mesh);
    }

    function createSkinMaterial(preset) {
      const mat = new THREE.MeshStandardMaterial({
        color: preset.color,
        roughness: 0.75,
        metalness: 0.05,
        emissive: preset.emissive,
        emissiveIntensity: 0.1,
        transparent: true,
      });
      setupXRayMaterial(mat);
      return mat;
    }

    function createBoneMaterial(preset) {
      const mat = new THREE.MeshStandardMaterial({
        color: preset.color,
        roughness: 0.4,
        metalness: 0.1,
        emissive: preset.color,
        emissiveIntensity: 0.15,
      });
      boneMaterials.push(mat);
      return mat;
    }

    // ===== 模型上传 =====
    function normalizeModel(group, targetSize = 2.0) {
      const box = new THREE.Box3().setFromObject(group);
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = targetSize / maxDim;
      group.scale.setScalar(scale);

      const center = new THREE.Vector3();
      box.getCenter(center);
      group.position.sub(center.multiplyScalar(scale));
      group.position.y += 0.6;
    }

    function clearGroup(group) {
      while (group.children.length > 0) {
        const child = group.children[0];
        group.remove(child);
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
          else child.material.dispose();
        }
      }
    }

    window.handleUpload = (event, type) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const arrayBuffer = e.target.result;
        const ext = file.name.split('.').pop().toLowerCase();

        if (ext === 'glb' || ext === 'gltf') {
          const loader = new GLTFLoader();
          loader.parse(arrayBuffer, '', (gltf) => {
            applyUploadedModel(gltf.scene, type);
            showToast(`已加载 ${type === 'skin' ? '外皮' : '骨骼'} 模型: ${file.name}`);
          }, (err) => {
            showToast('模型加载失败: ' + err.message);
          });
        } else if (ext === 'obj') {
          const text = new TextDecoder().decode(arrayBuffer);
          const loader = new OBJLoader();
          const obj = loader.parse(text);
          applyUploadedModel(obj, type);
          showToast(`已加载 ${type === 'skin' ? '外皮' : '骨骼'} 模型: ${file.name}`);
        } else {
          showToast('不支持的格式，请使用 .glb/.gltf/.obj');
        }
      };
      reader.readAsArrayBuffer(file);
    };

    function applyUploadedModel(model, type) {
      const targetGroup = type === 'skin' ? skinGroup : boneGroup;
      const mat = type === 'skin'
        ? createSkinMaterial(skinPresets[currentSkinIndex])
        : createBoneMaterial(bonePresets[currentBoneIndex]);

      clearGroup(targetGroup);

      model.traverse((child) => {
        if (child.isMesh) {
          const newMesh = new THREE.Mesh(child.geometry.clone(), mat);
          newMesh.position.copy(child.position);
          newMesh.rotation.copy(child.rotation);
          newMesh.scale.copy(child.scale);
          newMesh.castShadow = true;
          if (type === 'skin') newMesh.receiveShadow = true;
          targetGroup.add(newMesh);
        }
      });

      normalizeModel(targetGroup);

      if (type === 'skin') {
        hasUploadedSkin = true;
        document.getElementById('btn-upload-skin').classList.add('has-file');
        document.getElementById('btn-upload-skin').textContent = '✅ 已上传外皮';
      } else {
        hasUploadedBone = true;
        document.getElementById('btn-upload-bone').classList.add('has-file');
        document.getElementById('btn-upload-bone').textContent = '✅ 已上传骨骼';
      }
    }

    // ===== UI =====
    function setupUI() {
      const sc = document.getElementById('skin-colors');
      skinPresets.forEach((p, i) => {
        const b = document.createElement('div');
        b.className = 'color-btn' + (i === 0 ? ' selected' : '');
        b.style.backgroundColor = '#' + p.color.toString(16).padStart(6, '0');
        b.title = p.name;
        b.onclick = () => selectSkin(i);
        sc.appendChild(b);
      });

      const bc = document.getElementById('bone-colors');
      bonePresets.forEach((p, i) => {
        const b = document.createElement('div');
        b.className = 'color-btn' + (i === 0 ? ' selected' : '');
        b.style.backgroundColor = '#' + p.color.toString(16).padStart(6, '0');
        b.title = p.name;
        b.onclick = () => selectBone(i);
        bc.appendChild(b);
      });

      window.toggleBone = () => {
        showBone = !showBone;
        boneGroup.visible = showBone;
        document.getElementById('toggle-bone').classList.toggle('active', showBone);
      };
      window.toggleSkin = () => {
        showSkin = !showSkin;
        skinGroup.visible = showSkin;
        document.getElementById('toggle-skin').classList.toggle('active', showSkin);
      };
      window.selectSkin = (i) => {
        currentSkinIndex = i;
        const p = skinPresets[i];
        skinMaterials.forEach(m => {
          m.color.setHex(p.color);
          m.emissive.setHex(p.emissive);
        });
        document.querySelectorAll('#skin-colors .color-btn').forEach((b, j) => b.classList.toggle('selected', j === i));
      };
      window.selectBone = (i) => {
        currentBoneIndex = i;
        const p = bonePresets[i];
        boneMaterials.forEach(m => {
          m.color.setHex(p.color);
          m.emissive.setHex(p.color);
        });
        document.querySelectorAll('#bone-colors .color-btn').forEach((b, j) => b.classList.toggle('selected', j === i));
      };
      window.updateXRayRadius = (v) => {
        xRayRadius = parseFloat(v);
        document.getElementById('xray-radius-val').textContent = v;
        updateXRayUniforms();
      };
      window.updateXRayStrength = (v) => {
        xRayStrength = parseFloat(v);
        document.getElementById('xray-strength-val').textContent = Math.round(v * 100) + '%';
        updateXRayUniforms();
      };
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ===== 鼠标追踪 =====
    function setupMouseTracking() {
      renderer.domElement.addEventListener('mousemove', (e) => {
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      });
      renderer.domElement.addEventListener('mouseleave', () => {
        mouse.set(-999, -999);
        clearHoverPoint();
      });
    }

    function updateRaycaster() {
      if (!skinGroup || !showSkin) return;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(skinGroup.children, true);
      if (intersects.length > 0) {
        setHoverPoint(intersects[0].point);
      } else {
        clearHoverPoint();
      }
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ===== 动画 =====
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      updateRaycaster();

      if (animalGroup) {
        const breathe = 1 + Math.sin(t * 1.5) * 0.015;
        animalGroup.scale.set(breathe, breathe, breathe);

        const tailTip = skinGroup.children.find(c => c.position.x < -1);
        if (tailTip) {
          tailTip.position.y = 0.8 + Math.sin(t * 2.5) * 0.03;
          tailTip.position.z = -0.05 + Math.cos(t * 2.5) * 0.03;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
