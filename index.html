<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 模型粒子转换器</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Three.js & loaders -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="container">
    <!-- 3D Canvas -->
    <canvas id="canvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-panel" class="panel">
      <h1>🎆 3D 粒子模型转换器</h1>

      <!-- Upload -->
      <div class="section">
        <label class="btn-upload">
          <input type="file" id="modelInput" accept=".obj,.gltf,.glb,.fbx,.stl,.ply">
          📁 上传 3D 模型
        </label>
        <p class="hint">支持 .obj, .gltf, .glb, .fbx, .stl, .ply</p>
        <div id="modelInfo" class="model-info hidden"></div>
      </div>

      <!-- Preset Models -->
      <div class="section">
        <h3>🧊 预设模型</h3>
        <div class="preset-grid">
          <button class="preset-btn" data-preset="cube">立方体</button>
          <button class="preset-btn" data-preset="sphere">球体</button>
          <button class="preset-btn" data-preset="torus">圆环</button>
          <button class="preset-btn" data-preset="knot">扭结</button>
          <button class="preset-btn" data-preset="cone">圆锥</button>
          <button class="preset-btn" data-preset="icosahedron">二十面体</button>
        </div>
      </div>

      <!-- Particle Settings -->
      <div class="section">
        <h3>⚙️ 粒子设置</h3>

        <div class="control-row">
          <label>粒子密度</label>
          <input type="range" id="density" min="500" max="1000000" step="500" value="10000">
          <span id="densityVal">10000</span>
        </div>

        <div class="control-row">
          <label>粒子大小</label>
          <input type="range" id="pointSize" min="0.1" max="5" step="0.1" value="1.0">
          <span id="pointSizeVal">1.0</span>
        </div>

        <div class="control-row">
          <label>粒子透明度</label>
          <input type="range" id="opacity" min="0.1" max="1" step="0.05" value="1.0">
          <span id="opacityVal">1.0</span>
        </div>

        <div class="control-row">
          <label>颜色主题</label>
          <select id="colorTheme">
            <option value="cyan">赛博青 (默认)</option>
            <option value="original">🎨 模型原色</option>
            <option value="fire">火焰红</option>
            <option value="neon">霓虹紫</option>
            <option value="ocean">深海蓝</option>
            <option value="gold">流金</option>
            <option value="rainbow">彩虹</option>
            <option value="white">纯白</option>
          </select>
        </div>

        <div class="control-row">
          <label>背景颜色</label>
          <input type="color" id="bgColor" value="#0a0a0f" style="width:50px;height:28px;border:none;border-radius:6px;cursor:pointer;background:none;padding:0;">
        </div>
      </div>

      <!-- Animation Settings -->
      <div class="section">
        <h3>🎬 动画效果</h3>

        <div class="control-row">
          <label>动画模式</label>
          <select id="animMode">
            <option value="none">静止</option>
            <option value="explode" selected>爆炸聚合</option>
            <option value="wave">波浪起伏</option>
            <option value="breathe">呼吸脉冲</option>
            <option value="spiral">螺旋旋转</option>
            <option value="orbit">轨道环绕</option>
          </select>
        </div>

        <div class="control-row">
          <label>动画强度</label>
          <input type="range" id="animStrength" min="0" max="200" step="1" value="80">
          <span id="animStrengthVal">80</span>
        </div>

        <div class="control-row">
          <label>动画速度</label>
          <input type="range" id="animSpeed" min="0.1" max="5" step="0.1" value="1.0">
          <span id="animSpeedVal">1.0</span>
        </div>

        <div class="control-row">
          <label>自转速度</label>
          <input type="range" id="rotationSpeed" min="0" max="2" step="0.05" value="0.2">
          <span id="rotationSpeedVal">0.2</span>
        </div>
      </div>

      <!-- Display Options -->
      <div class="section">
        <h3>👁️ 显示选项</h3>
        <div class="checkbox-row">
          <input type="checkbox" id="showWireframe">
          <label for="showWireframe">显示线框</label>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="autoRotate" checked>
          <label for="autoRotate">自动旋转</label>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="glowEffect" checked>
          <label for="glowEffect">发光效果</label>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="connectLines">
          <label for="connectLines">粒子连线</label>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="randomSize">
          <label for="randomSize">随机粒子大小</label>
        </div>
      </div>

      <!-- Actions -->
      <div class="section actions">
        <button id="resetCamera" class="btn-secondary">🎥 重置视角</button>
        <button id="screenshot" class="btn-secondary">📸 截图保存</button>
      </div>

      <!-- Stats -->
      <div class="section stats">
        <div id="fpsCounter">FPS: --</div>
        <div id="particleCount">粒子数: --</div>
      </div>
    </div>

    <!-- Loading overlay -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>正在加载模型...</p>
    </div>

    <!-- Help tooltip -->
    <div id="help-tip" class="help-tip">
      <p>🖱️ 左键拖拽旋转 | 右键拖拽平移 | 滚轮缩放</p>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
